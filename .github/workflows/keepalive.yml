name: keepalive

# GitHub switches off scheduled workflows in a public repository after 60 days
# with no activity. Once a month this records the date in keepalive.txt, which
# counts as activity and keeps the 5-minute "watch" schedule running for good.
on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Record the date
        run: |
          date -u +%Y-%m-%d > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git commit -m "Monthly keepalive" || echo "nothing to commit"
          git push
