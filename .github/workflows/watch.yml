name: watch

on:
  schedule:
    # Backup timer: every 5 minutes, all day. GitHub often starts these late or
    # skips them; the main trigger is cron-job.org calling workflow_dispatch
    # every 2 minutes.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      inbox_test:
        description: "Also send my 3 latest Doorzo messages, to test inbox alerts"
        type: boolean
        default: false
      auction_test:
        description: "Also send up to 3 of my favourite Yahoo auctions, to test auction reminders"
        type: boolean
        default: false

permissions:
  contents: read

# Never let two checks run at once, or they would both alert for the same item.
concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # seen.json (items already alerted) is kept in the Actions cache rather
      # than committed, so the repository history stays clean.
      - uses: actions/cache/restore@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-

      - name: Check Doorzo
        run: python3 watcher.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional: a signed-in Doorzo session for inbox alerts (see README).
          DOORZO_COOKIE: ${{ secrets.DOORZO_COOKIE }}
          INBOX_TEST: ${{ inputs.inbox_test }}
          AUCTION_TEST: ${{ inputs.auction_test }}

      - uses: actions/cache/save@v4
        if: always() && hashFiles('seen.json') != ''
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
